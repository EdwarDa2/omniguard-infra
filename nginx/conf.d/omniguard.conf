# ============================================================
# OmniGuard SOC - Configuración adicional (incluida desde nginx.conf)
# Este archivo se incluye via: include /etc/nginx/conf.d/*.conf;
# ============================================================

# Configuración de upstream con health checks pasivos
upstream core_api {
    zone core_api_zone 64k;
    least_conn;

    server core-api:8080 max_fails=3 fail_timeout=10s weight=100;
    # server core-api-2:8080 max_fails=3 fail_timeout=10s weight=100;  # Para escalado

    keepalive 32;
    keepalive_requests 100;
    keepalive_timeout 60s;
}

# Map para request_id único
map $http_x_request_id $request_id {
    default $http_x_request_id;
    "" $request_id;
}

