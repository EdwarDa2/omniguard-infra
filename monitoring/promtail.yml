# ============================================================
# OmniGuard SOC - Promtail Configuration
# Log collection for Loki
# ============================================================

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # ------------------------------------------------------------------
  # Docker containers (stdout/stderr)
  # ------------------------------------------------------------------
  - job_name: docker-containers
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker-logs
          __path__: /var/lib/docker/containers/*/*-json.log
    pipeline_stages:
      - json:
          expressions:
            container: container_name
            stream: stream
            log: log
      - labels:
          container:
      - match:
          selector: '{container=~"omniguard-.*"}'
          stages:
            - json:
                expressions:
                  timestamp: timestamp
                  level: level
                  service: service
                  trace_id: trace_id
                  span_id: span_id
                  user_id: user_id
                  action: action
                  result: result
                  duration_ms: duration_ms
                  message: message
            - timestamp:
                source: timestamp
                format: RFC3339
            - labels:
                level:
                service:
                trace_id:
                span_id:
                user_id:

  # ------------------------------------------------------------------
  # Nginx access logs
  # ------------------------------------------------------------------
  - job_name: nginx-access
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx-access
          service: nginx
          __path__: /var/log/nginx/access.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            remote_addr: remote_addr
            remote_user: remote_user
            request: request
            status: status
            body_bytes_sent: body_bytes_sent
            request_time: request_time
            upstream_response_time: upstream_response_time
            upstream_addr: upstream_addr
            http_referrer: http_referer
            http_user_agent: http_user_agent
            http_x_forwarded_for: http_x_forwarded_for
            request_id: request_id
      - timestamp:
          source: timestamp
          format: RFC3339
      - labels:
          status:

  # ------------------------------------------------------------------
  # Nginx error logs
  # ------------------------------------------------------------------
  - job_name: nginx-error
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx-error
          service: nginx
          __path__: /var/log/nginx/error.log
    pipeline_stages:
      - regex:
          expression: '^(?P<timestamp>\d{4}/\d{2}/\d{2} \d{2}:\d{2}:\d{2}) \[(?P<level>\w+)\] (?P<message>.*)'
      - timestamp:
          source: timestamp
          format: '2006/01/02 15:04:05'
      - labels:
          level:

  # ------------------------------------------------------------------
  # Systemd journal (host logs)
  # ------------------------------------------------------------------
  - job_name: systemd-journal
    journal:
      path: /var/log/journal
      labels:
        job: systemd-journal
    pipeline_stages:
      - match:
          selector: '{__SYSTEMD_UNIT=~"docker|nginx|postgres|redis.*"}'
          stages:
            - labels:
                unit: __SYSTEMD_UNIT