# ============================================================
# OmniGuard SOC - Prometheus Alerting Rules
# ============================================================

groups:
  # ------------------------------------------------------------------
  # Core API Alerts
  # ------------------------------------------------------------------
  - name: core-api
    interval: 30s
    rules:
      - alert: CoreAPIDown
        expr: up{job="core-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Core API está caído"
          description: "Core API no responde desde hace 1 minuto"

      - alert: CoreAPIHighErrorRate
        expr: rate(http_server_requests_seconds_count{job="core-api",status=~"5.."}[5m]) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Alta tasa de errores en Core API"
          description: "Tasa de errores 5xx > 5% en los últimos 5 minutos"

      - alert: CoreAPIHighLatency
        expr: histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket{job="core-api"}[5m])) by (le, uri)) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Latencia alta en Core API (p95 > 2s)"
          description: "Latencia p95 superior a 2 segundos en {{ $labels.uri }}"

      - alert: CoreAPIHighMemoryUsage
        expr: jvm_memory_used_bytes{job="core-api",area="heap"} / jvm_memory_max_bytes{job="core-api",area="heap"} > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Uso de memoria JVM alto (>85%)"
          description: "Heap usage: {{ $value | humanizePercentage }}"

      - alert: CoreAPIHighGCActivity
        expr: rate(jvm_gc_pause_seconds_sum{job="core-api"}[5m]) / rate(jvm_gc_pause_seconds_count{job="core-api"}[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "GC pauses altos en Core API"
          description: "Pause promedio GC: {{ $value }}s"

      - alert: CoreAPIDBPoolExhausted
        expr: hikaricp_connections_active{job="core-api"} / hikaricp_connections_max{job="core-api"} > 0.9
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Pool de conexiones DB agotado (>90%)"
          description: "Conexiones activas: {{ $value | humanizePercentage }}"

  # ------------------------------------------------------------------
  # Alertas de Negocio (SOC)
  # ------------------------------------------------------------------
  - name: soc-business
    interval: 60s
    rules:
      - alert: HighAlertRate
        expr: rate(alerts_created_total[5m]) > 10
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Alta tasa de alertas generadas"
          description: "{{ $value }} alertas/segundo en los últimos 5 minutos"

      - alert: CriticalAlertsSpike
        expr: rate(alerts_created_total{severity="CRITICAL"}[5m]) > 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Pico de alertas CRITICAL"
          description: "{{ $value }} alertas CRITICAL/segundo"

      - alert: NoAlertsReceived
        expr: rate(alerts_created_total[10m]) == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "No se reciben alertas (posible sensor caído)"
          description: "No hay alertas en los últimos 10 minutos"

      - alert: HighVulnerabilityCount
        expr: sum(vulnerabilities_total{severity="CRITICAL"}) > 50
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Muchas vulnerabilidades CRITICAL sin resolver"
          description: "{{ $value }} vulnerabilidades CRITICAL abiertas"

  # ------------------------------------------------------------------
  # Infraestructura
  # ------------------------------------------------------------------
  - name: infrastructure
    interval: 30s
    rules:
      - alert: PostgreSQLDown
        expr: up{job="postgres"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL está caído"

      - alert: PostgreSQLHighConnections
        expr: pg_stat_database_numbackends / pg_settings_max_connections > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL conexiones altas (>80%)"

      - alert: PostgreSQLLongRunningQueries
        expr: max(pg_stat_activity_max_tx_duration) > 300
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Queries largas en PostgreSQL (>5 min)"

      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis está caído"

      - alert: RedisHighMemory
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis memoria alta (>85%)"

      - alert: NginxDown
        expr: up{job="nginx"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Nginx está caído"

      - alert: NginxHighErrorRate
        expr: rate(nginx_http_requests_total{status=~"5.."}[5m]) / rate(nginx_http_requests_total[5m]) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Nginx alta tasa de errores 5xx"

      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes / node_filesystem_size_bytes) < 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Espacio en disco bajo (<10%)"
          description: "{{ $labels.instance }}: {{ $value | humanizePercentage }} libre"

      - alert: CPUHigh
        expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "CPU alta (>85%)"
          description: "Instancia {{ $labels.instance }}: {{ $value }}%"

      - alert: MemoryHigh
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 0.9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Memoria alta (>90%)"
          description: "Instancia {{ $labels.instance }}: {{ $value | humanizePercentage }}"