# ============================================================
# OmniGuard SOC - Blackbox Exporter Configuration
# ============================================================

modules:
  http_2xx:
    prober: http
    timeout: 10s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2"]
      valid_status_codes: [200]
      method: GET
      headers:
        User-Agent: "OmniGuard Blackbox Prober"
      tls_config:
        insecure_skip_verify: false
      preferred_ip_protocol: "ip4"

  http_post_2xx:
    prober: http
    timeout: 10s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2"]
      valid_status_codes: [200]
      method: POST
      headers:
        Content-Type: "application/json"
        User-Agent: "OmniGuard Blackbox Prober"

  tcp_connect:
    prober: tcp
    timeout: 10s

  pop3s_banner:
    prober: tcp
    timeout: 10s
    tcp:
      query_response:
        - expect: "^+OK"
          send: "QUIT\r\n"

  ssh_banner:
    prober: tcp
    timeout: 10s
    tcp:
      query_response:
        - expect: "^SSH-2.0-"
          send: "\r\n"

  irc_banner:
    prober: tcp
    timeout: 10s
    tcp:
      query_response:
        - expect: "^PING :"
          send: "PONG\r\n"

  icmp:
    prober: icmp
    timeout: 10s
    icmp:
      preferred_ip_protocol: "ip4"