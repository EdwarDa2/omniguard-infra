# ============================================================
# OmniGuard SOC - Alertmanager Configuration
# Rutas: critical -> PagerDuty, warning -> Slack/Email
# ============================================================

global:
  resolve_timeout: 5m
  smtp_smarthost: '${SMTP_HOST:-smtp.example.com:587}'
  smtp_from: 'alertmanager@omniguard.local'
  smtp_auth_username: '${SMTP_USER:-alertmanager}'
  smtp_auth_password: '${SMTP_PASS:-}'
  smtp_require_tls: true

templates:
  - '/etc/alertmanager/templates/*.tmpl'

route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'
  routes:
    # Rutas críticas - notificación inmediata
    - match:
        severity: critical
      receiver: 'pagerduty'
      continue: true

    # Rutas de warning - notificación estándar
    - match:
        severity: warning
      receiver: 'slack-warning'
      continue: true

    # Rutas de info - solo log
    - match:
        severity: info
      receiver: 'log-only'

    # Rutas específicas por servicio
    - match:
        service: core-api
      receiver: 'core-api-team'

    - match:
        service: postgres
      receiver: 'dba-team'

receivers:
  # ------------------------------------------------------------------
  # Default: Slack general
  # ------------------------------------------------------------------
  - name: 'default'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL:-}'
        channel: '#omniguard-alerts'
        title: '{{ .CommonLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}\n{{ .Annotations.description }}{{ end }}'
        color: '{{ if eq .CommonLabels.severity "critical" }}danger{{ else if eq .CommonLabels.severity "warning" }}warning{{ else }}good{{ end }}'
        footer: 'OmniGuard SOC Alertmanager'
        fields:
          - title: Severity
            value: '{{ .CommonLabels.severity }}'
            short: true
          - title: Service
            value: '{{ .CommonLabels.service }}'
            short: true
          - title: Instance
            value: '{{ .CommonLabels.instance }}'
            short: true

  # ------------------------------------------------------------------
  # PagerDuty para critical
  # ------------------------------------------------------------------
  - name: 'pagerduty'
    pagerduty_configs:
      - service_key: '${PAGERDUTY_KEY:-}'
        severity: '{{ .CommonLabels.severity }}'
        component: '{{ .CommonLabels.service }}'
        group: '{{ .CommonLabels.cluster }}'
        class: '{{ .CommonLabels.alertname }}'
        details:
          firing: '{{ .Alerts.Firing | len }}'
          resolved: '{{ .Alerts.Resolved | len }}'

  # ------------------------------------------------------------------
  # Slack warning (canal dedicado)
  # ------------------------------------------------------------------
  - name: 'slack-warning'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL:-}'
        channel: '#omniguard-warning'
        title: '[WARNING] {{ .CommonLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}\n{{ .Annotations.description }}{{ end }}'
        color: 'warning'

  # ------------------------------------------------------------------
  # Email para DBA team
  # ------------------------------------------------------------------
  - name: 'dba-team'
    email_configs:
      - to: '${DBA_EMAIL:-dba@omniguard.local}'
        from: 'alertmanager@omniguard.local'
        subject: '[DBA] {{ .CommonLabels.alertname }} - {{ .CommonLabels.severity }}'
        html: |
          <h2>{{ .CommonLabels.alertname }}</h2>
          <p><strong>Severity:</strong> {{ .CommonLabels.severity }}</p>
          <p><strong>Service:</strong> {{ .CommonLabels.service }}</p>
          <p><strong>Instance:</strong> {{ .CommonLabels.instance }}</p>
          {{ range .Alerts }}
          <p><strong>Summary:</strong> {{ .Annotations.summary }}</p>
          <p><strong>Description:</strong> {{ .Annotations.description }}</p>
          {{ end }}

  # ------------------------------------------------------------------
  # Core API team
  # ------------------------------------------------------------------
  - name: 'core-api-team'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL:-}'
        channel: '#omniguard-core-api'
        title: '[CORE-API] {{ .CommonLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}\n{{ .Annotations.description }}{{ end }}'

  # ------------------------------------------------------------------
  # Log only (para info/debug)
  # ------------------------------------------------------------------
  - name: 'log-only'
    webhook_configs:
      - url: 'http://log-collector:8080/alerts'
        http_config:
          basic_auth:
            username: 'alertmanager'
            password: '${LOG_COLLECTOR_PASS:-}'

inhibit_rules:
  # Inhibir warning si hay critical del mismo alertname
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'cluster', 'service']

  # Inhibir info si hay warning
  - source_match:
      severity: 'warning'
    target_match:
      severity: 'info'
    equal: ['alertname', 'cluster', 'service']