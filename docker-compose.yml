services:
  redis:
    image: redis:7-alpine
    container_name: omniguard-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - omniguard

  postgres:
    image: postgres:16-alpine
    container_name: omniguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - omniguard

  analyzer:
    build:
      context: ..
      dockerfile: omniguard-infra/docker/analyzer.Dockerfile
    container_name: omniguard-analyzer
    restart: unless-stopped
    command: ${ANALYZER_ARGS}
    environment:
      REDIS_HOST: ${ANALYZER_REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_CHANNEL: ${REDIS_CHANNEL}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - omniguard

  cve-sync:
    build:
      context: .
      dockerfile: docker/cve-sync.Dockerfile
    container_name: omniguard-cve-sync
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PORT: 5432
      NVD_API_KEY: ${NVD_API_KEY:-}
      NVD_BASE_URL: ${NVD_BASE_URL:-https://services.nvd.nist.gov/rest/json/cves/2.0}
      CVE_SYNC_INTERVAL_SECONDS: ${CVE_SYNC_INTERVAL_SECONDS:-86400}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - omniguard

  sensor:
    build:
      context: ..
      dockerfile: omniguard-infra/docker/sensor.Dockerfile
    container_name: omniguard-sensor
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_RAW
      - NET_ADMIN
    environment:
      REDIS_HOST: ${SENSOR_REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      INTERFACE: ${INTERFACE}
      BPF_FILTER: ${BPF_FILTER}
    depends_on:
      redis:
        condition: service_healthy

networks:
  omniguard:
    driver: bridge

volumes:
  postgres-data:
